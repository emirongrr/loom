name: pull-request-policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pull-request-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Validate title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a conventional title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|test|build|ci|chore|docs|security)(\([a-z0-9][a-z0-9._/-]*\))?!?: [a-z0-9].+$'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must use: type(optional-scope): lowercase description"
            echo "::error::Allowed types: feat, fix, refactor, perf, test, build, ci, chore, docs, security"
            echo "::error::Example: fix(account): isolate direct execution nonces"
            exit 1
          fi

  change-class:
    name: Validate change class
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The body is passed through the environment, never interpolated into the
      # shell, so a pull request description cannot become a command.
      - name: Require a declared change class
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/ci/validate-change-class.mjs --base "$BASE_SHA"
