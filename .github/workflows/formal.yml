name: formal-properties

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean authority model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Lean
        run: |
          # Pinned to a commit and checksum-verified: `master` would let an
          # upstream change run arbitrary code in a job that has repository
          # checkout access. Update the pair together when bumping elan.
          ELAN_COMMIT=464c9d28395000a2a0128e07081e4956d50eced2
          ELAN_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl -sSfL --proto '=https' --tlsv1.2             "https://raw.githubusercontent.com/leanprover/elan/$ELAN_COMMIT/elan-init.sh" -o elan-init.sh
          echo "$ELAN_SHA256  elan-init.sh" | sha256sum --check --status
          sh elan-init.sh -y --default-toolchain "$(cat formal/lean/lean-toolchain)"
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean model
        run: cd formal/lean && lake build

  halmos:
    name: Symbolic properties
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Halmos
        run: uv tool install --python 3.12 halmos==0.3.3
      - name: Check formal test documentation
        run: test -f test/formal/README.md
      - name: Verify initialization properties
        run: timeout 300s halmos --contract LoomAccountInitializationFormal
      - name: Verify authority properties
        run: timeout 300s halmos --contract LoomAccountAuthorityFormal
      - name: Verify execution properties
        run: timeout 300s halmos --contract LoomAccountExecutionFormal
      - name: Verify recovery properties
        run: timeout 300s halmos --contract LoomAccountRecoveryFormal
      - name: Verify migration properties
        run: timeout 300s halmos --contract LoomAccountMigrationFormal
      - name: Verify vault hook properties
        run: timeout 300s halmos --contract LoomVaultHookFormal
      - name: Verify keystore sync properties
        run: timeout 300s halmos --contract LoomKeystoreSyncFormal
